<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7EE787"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title{
        font:700 54px Inter,Segoe UI,Arial,sans-serif;
        fill:#ffffff;
        letter-spacing:2px;
      }
      .subtitle{
        font:500 22px Inter,Segoe UI,Arial,sans-serif;
        fill:#58A6FF;
      }
      .text{
        font:400 20px Inter,Segoe UI,Arial,sans-serif;
        fill:#c9d1d9;
      }
      .chip{
        fill:#21262d;
        stroke:#30363d;
      }
      .chipText{
        font:600 16px Inter,Arial,sans-serif;
        fill:#ffffff;
      }
      .line{
        stroke:#58A6FF;
        stroke-width:1.5;
        opacity:.35;
      }
      .node{
        fill:#58A6FF;
        filter:url(#glow);
      }
      .pulse{
        animation:pulse 4s ease-in-out infinite;
      }
      @keyframes pulse{
        0%{opacity:.25}
        50%{opacity:1}
        100%{opacity:.25}
      }
      .float{
        animation:float 10s ease-in-out infinite;
      }
      @keyframes float{
        0%{transform:translateY(0px)}
        50%{transform:translateY(-6px)}
        100%{transform:translateY(0px)}
      }
    </style>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- background grid -->
